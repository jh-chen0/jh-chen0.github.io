<header class="page-head"><h1>超声内镜引导细针活检的手持式机器人针驱动装置</h1><p>可复用手持驱动主体与一次性活检针快拆连接，提供三种针运动模式。</p></header>
<figure class="detail-figure"><img src="../../../assets/projects/biopsy-motion.webp" alt="三条示意轨迹分别表示快速穿刺、匀速进针和往复取样。"><figcaption>三种运动模式下针位置随时间变化的示意，依据简历中的项目描述绘制。</figcaption></figure>
<div class="prose"><p>我面向超声内镜引导下经胃壁取样的脾脏病灶，设计并研制了手持式机器人活检针驱动样机。可重复使用的驱动主体通过快拆接口连接一次性活检针。我针对穿刺与组织取样的不同需求，实现了快速穿刺、控速进针与往复取样三种运动模式。</p></div></article></main>
