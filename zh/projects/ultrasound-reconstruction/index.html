<header class="page-head"><h1>膀胱与前列腺的机器人超声扫描及三维重建</h1><p>这项在研工作利用 RGB-D 腹部表面成像为 UR5 机械臂规划经腹超声扫描路径。</p></header>
<figure class="detail-figure"><img src="../../../assets/projects/ultrasound-reconstruction.webp" alt="腹部表面点云、扫描轨迹和以断层截面表示的三维重建流程示意。"><figcaption>从腹部表面采集到三维重建的研究流程示意，依据简历中的项目描述绘制。</figcaption></figure>
<div class="prose"><p>我正在开发基于 RGB-D 图像的腹部表面重建与扫描路径规划方法，用于 UR5 机械臂辅助的经腹超声扫描。同时，我在实现力反馈与导纳控制，以调节超声探头与腹部的接触。项目旨在提高膀胱与前列腺形态和体积测量的可重复性。</p></div></article></main>
